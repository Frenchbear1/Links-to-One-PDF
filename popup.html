<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --red:#c82828; --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e3e6; --bg:#fafafa; }
  * { box-sizing: border-box; }
  body { margin:0; width:360px; font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:#fff; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  header img { width:22px; height:22px; }
  header h1 { font-size:14px; margin:0; }
  main { padding:12px 14px; display:grid; gap:10px; }
  label { display:grid; gap:4px; font-weight:600; font-size:12px; }
  label small { font-weight:400; color:var(--muted); }
  input[type=text], input[type=number], select { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .check { display:flex; gap:8px; align-items:center; font-weight:400; font-size:12.5px; }
  details { border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:var(--bg); }
  details summary { cursor:pointer; font-weight:600; font-size:12px; }
  details[open] { display:grid; gap:10px; padding-bottom:10px; }
  .preview { font-size:12px; color:var(--muted); background:var(--bg); border-radius:8px; padding:8px 10px; min-height:20px; max-height:120px; overflow:auto; word-break:break-all; }
  .preview b { color:var(--ink); }
  .buttons { display:grid; grid-template-columns:1fr 2fr; gap:8px; }
  button { padding:9px; border-radius:8px; border:1px solid var(--line); background:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.primary { background:var(--red); border-color:var(--red); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><h1>Links to One PDF</h1></header>
<main>
  <label>Start page
    <input type="text" id="startUrl">
  </label>

  <div class="row">
    <label>How deep
      <select id="depth">
        <option value="1">1 – links on this page</option>
        <option value="2">2 – + links inside those</option>
        <option value="3">3 – one level more</option>
      </select>
    </label>
    <label>Which links
      <select id="scope">
        <option value="site">Same website</option>
        <option value="folder">Same folder only</option>
        <option value="any">Any website</option>
      </select>
    </label>
  </div>

  <label>Only links containing <small>(optional, comma-separated)</small>
    <input type="text" id="include" placeholder="e.g. /notebook/">
  </label>

  <details>
    <summary>More options</summary>
    <label>Skip links containing <small>(comma-separated)</small>
      <input type="text" id="exclude" placeholder="e.g. login, cart, /tag/">
    </label>
    <div class="row">
      <label>Max pages<input type="number" id="maxPages" min="1" max="5000"></label>
      <label>Tabs at once<input type="number" id="parallel" min="1" max="6"></label>
    </div>
    <div class="row">
      <label>Wait after load (ms)<input type="number" id="waitMs" min="0" max="30000" step="250"></label>
      <label>Paper
        <select id="paper"><option value="letter">Letter</option><option value="a4">A4</option></select>
      </label>
    </div>
    <label>Page order
      <select id="order">
        <option value="reading">Reading order (page, then the pages it links to)</option>
        <option value="level">Level by level (all of level 1, then level 2…)</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="includeStart"> Include the start page itself</label>
    <label class="check"><input type="checkbox" id="footer"> Print the source URL + page number at the bottom</label>
    <label class="check"><input type="checkbox" id="linkedPdfs"> Also merge links that are already PDF files</label>
  </details>

  <div class="preview" id="preview">Checking this page…</div>

  <div class="buttons">
    <button id="rescan">Re-check</button>
    <button id="start" class="primary">Make one PDF</button>
  </div>
</main>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
